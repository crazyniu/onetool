name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CODE_SIGN_IDENTITY: '-'
      ARCHS: arm64 x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build full universal app
        run: ./build.sh
      - name: Core checks
        run: ./test.sh
      - name: Package development DMG
        env:
          PACKAGE_ARCH: universal
        run: Tools/package-dmg.sh --development
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-builds
          path: dist/*
          if-no-files-found: error
