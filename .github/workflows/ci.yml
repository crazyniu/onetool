name: Build and test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CODE_SIGN_IDENTITY: '-'
      ARCHS: arm64 x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build universal app
        run: ./build.sh
      - name: Core checks
        run: ./test.sh
