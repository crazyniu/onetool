name: Build DMG
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CODE_SIGN_IDENTITY: '-'
      ARCHS: arm64 x86_64
      PACKAGE_ARCH: universal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]] || { echo 'Tag must match CFBundleShortVersionString.' >&2; exit 1; }
      - name: Build universal app without an Apple certificate
        run: ./build.sh
      - name: Core checks
        run: ./test.sh
      - name: Package unsigned DMG
        run: Tools/package-dmg.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-dmg
          path: dist/*unsigned.dmg*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*unsigned.dmg dist/*unsigned.dmg.sha256 --verify-tag --title "1Tool $GITHUB_REF_NAME" --notes "Universal macOS app. No Apple signing certificate or notarization is included. The app and Finder extension use certificate-free ad-hoc code signatures. Requires macOS 14 or later."
