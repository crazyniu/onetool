name: Signed and notarized DMG
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ARCHS: arm64 x86_64
      PACKAGE_ARCH: universal
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]] || { echo 'Tag must match CFBundleShortVersionString.' >&2; exit 1; }
      - name: Import signing identity and notarization key
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
        run: Tools/import-signing.sh
      - name: Build signed universal app
        run: ./build.sh
      - name: Core checks
        run: ./test.sh
      - name: Create, sign, notarize and verify DMG
        run: Tools/package-dmg.sh --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-notarized-dmg
          path: dist/*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 --verify-tag --title "1Tool $GITHUB_REF_NAME" --generate-notes
      - name: Remove signing material
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/onetool-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/onetool-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/onetool-signing.p12" "$RUNNER_TEMP/onetool-notary.p8"
